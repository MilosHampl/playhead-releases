name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the problem or the situation first, then your idea.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it matter to you?
